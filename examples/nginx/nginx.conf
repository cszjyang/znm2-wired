# Example only: replace documentation addresses and install your own certificate.
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_buffer_size 16k;
    client_max_body_size 32m;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10;
    proxy_read_timeout 3600;
    proxy_send_timeout 300;
    map $http_upgrade $upstream_connection { default upgrade; '' ''; }
    server {
        listen 8443 ssl;
        server_name gateway.example.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/ssl/znm2/fullchain.pem;
        ssl_certificate_key /etc/ssl/znm2/private.key;
        ssl_session_cache shared:TLS:1m;
        location / {
            proxy_pass http://192.0.2.10:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $upstream_connection;
        }
    }
}
